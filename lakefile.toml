name = "SunCotangent"
version = "1.0.1"
defaultTargets = ["SunCotangent", "Challenge", "Solution"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.0"

[[lean_lib]]
name = "SunCotangent"
leanOptions = {warningAsError = true}

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
leanOptions = {warningAsError = true}
